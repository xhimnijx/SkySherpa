[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skysherpa"
version = "0.1.0"
description = "A dispatcher for the VATSIM network: observe, forecast, and recommend the flight worth your evening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - not yet chosen" }
authors = [{ name = "Maxim Gil" }]
keywords = ["vatsim", "flight-simulation", "dispatching", "forecasting", "atc"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

# P0 (this milestone) is deliberately stdlib-only so the repo runs on a bare
# Python install. Heavier pieces land in P1+ behind the extras below.
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "apscheduler>=3.10",
  "httpx>=0.27",
]
science = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.12",
]

[project.scripts]
skysherpa = "skysherpa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default. `pytest -m network` (or `make test-live`) runs the live checks.
addopts = "-q -m 'not network'"
markers = [
  "network: hits live VATSIM/NOAA endpoints (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
